{
  "deployment": {
    "mode": "LOCAL"
  },
  "paths": {
    "workspaceRoot": "workspaces",
    "logRoot": "logs",
    "skillRoot": "skills",
    "agentRoot": "agents"
  },
  "observability": {
    "logging": {
      "diagnosticDetail": "normal",
      "level": "info",
      "console": {
        "enabled": false
      },
      "file": {
        "enabled": true,
        "name": "nextagent-operational.log.jsonl",
        "rotation": {
          "maxFileSizeMiB": 30
        },
        "retentionDays": 7,
        "maxArchiveFiles": 10
      }
    },
    "tracing": {
      "enabled": true
    }
  },
  "channel": {
    "web": {
      "transport": "fastify",
      "host": "127.0.0.1",
      "port": 31872,
      "routePrefix": "/"
    },
    "auth": {
      "mode": "none"
    }
  },
  "gateway": {
    "implementationConfig": {
      "blockedTerms": [
        "credential"
      ],
      "rag": {
        "sources": [
          {
            "agentId": "default-agent",
            "logicalSourceRef": "local",
            "workspaceRelativePath": "."
          }
        ]
      },
      "sandbox": {
        "enabled": true,
        "deniedExecutables": []
      }
    }
  },
  "agents": {
    "activeAgentId": "default-agent"
  },
  "models": {
    "profiles": [
      {
        "providerId": "openai-compatible",
        "baseUrl": "env:OPENAI_BASE_URL",
        "credentialRef": "env:OPENAI_API_KEY",
        "models": [
          {
            "modelId": "env:OPENAI_MODEL_NAME",
            "displayName": "Default OpenAI Model",
            "contextWindowTokens": 128000,
            "fallbackEligible": false,
            "temperature": 0.2,
            "maxOutputTokens": 10240,
            "topP": 1,
            "timeoutMs": 3600000,
            "firstProgressTimeoutMs": 120000,
            "progressIdleTimeoutMs": 120000
          }
        ]
      }
    ]
  },
  "capability": {
    "rag": {
      "indexes": [
        "local"
      ]
    },
    "sandbox": {
      "allowedApis": [],
      "allowedExecutables": [
        "clipc",
        "curl",
        "python"
      ],
      "clipcExecutableDirectoryEnv": "CLIP_HOME",
      "enabled": false,
      "deniedExecutables": []
    }
  },
  "memory": {
    "enabled": true,
    "search": {
      "defaultLimit": 20,
      "minConfidence": 0.3
    },
    "extraction": {
      "enabled": true,
      "strategy": "RULE_FIRST",
      "crossSessionSchedule": "0 0 0 * * ?",
      "maxCycleTrajectories": 20,
      "maxCandidates": 50,
      "timeoutMs": 60000,
      "lookbackDays": 7
    },
    "aging": {
      "enabled": true,
      "schedule": "0 0 0 * * ?",
      "decayStaleDays": 30,
      "archiveRetentionDays": 90,
      "decayFactor": 0.05,
      "batchLimit": 1000,
      "timeoutMs": 30000,
      "reviveConfidenceBoost": 0.1
    }
  },
  "plugins": [
    {
      "pluginId": "developer-hook-trace",
      "path": "plugins/developer-hook-trace",
      "required": true
    }
  ]
}
